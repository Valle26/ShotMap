<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shot Map">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Gunners Shot Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Saira:wght@400;500;600&display=swap">
<style>
/* Layout: scoreboard strip over a full-width rink; tools below, bottom sheet for fast shot entry. Fixed black/yellow shell (single dark theme); shot markers home red vs. away blue. */
:root{
  --bg:#0e0f11; --surface:#17181b; --surface-2:#212226; --line:#2d2e33;
  --fg:#f1efe8; --muted:#a09e96;
  --accent:#f5c518; --accent-text:#f5c518; --on-accent:#141208; --on-mark:#ffffff;
  --home:#d7263d; --away:#1f5fd1;
  --ev:#8a919b; --pp:#16a05a; --sh:#8b5cf6; --danger:#ef5b5f; --ok:#34c77b;
  --ice:#eef2f5; --ice-shade:#e3e9ee; --rink-red:#e3a4aa; --rink-blue:#a9bde3; --rink-board:#5d6068; --crease:#dde8f5;
  --mk-stroke:#eef2f5; --mk-ink:#15181d; --post:#d7263d; --mesh:#c3ccd6; --slot-fill:rgba(245,197,24,.22); --slot-line:#c99700;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Saira",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
.tablewrap,.recent{touch-action:pan-x pan-y}
.rink{touch-action:pan-y}
.net,.big{touch-action:none}
body{margin:0;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:fixed;inset:0;display:flex;flex-direction:column}

/* Header */
.top{flex:none;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:12px;padding-inline:max(16px,calc((100% - 1040px) / 2));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.puck{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none}
.puck i{width:16px;height:16px;border-radius:50%;border:3px solid var(--on-accent);display:grid;place-items:center}
.puck i::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--on-accent)}
.brand b{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1;margin-top:1px}
.sync{display:inline-flex;align-items:center;gap:5px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--ok)} .sync.wait::before{background:var(--accent)} .sync.err::before{background:var(--danger)}
nav{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:500}
.tab[aria-current="true"]{background:var(--surface-2);color:var(--fg)}
.tab.new{background:var(--accent);color:var(--on-accent);font-weight:600}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;margin-left:4px;padding-inline:5px}

main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;display:grid;grid-template-columns:minmax(0,1fr);align-content:start;gap:16px;padding-top:16px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));padding-inline:max(16px,calc((100% - 1040px) / 2))}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;font-size:13px;color:var(--muted);font-weight:600}
h2{font-family:var(--display);font-size:26px;margin:0;line-height:1.1;text-wrap:balance}
.chip{display:inline-block;white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted);vertical-align:middle}
.chip.live{background:var(--danger);color:#fff}
.chip.ex{border:1px dashed var(--muted);background:transparent}
.chip.ok{background:var(--ok);color:#06140c}
.chip.adm{background:var(--accent);color:var(--on-accent)}
.chip.wait{background:transparent;border:1px solid var(--accent);color:var(--accent-text)}

/* Scoreboard */
.board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.team{min-width:0}
.team.away{text-align:right}
.team .nm{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.1;overflow-wrap:normal;hyphens:auto;display:flex;align-items:center;gap:8px}
.team.away .nm{justify-content:flex-end}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.dot.h{background:var(--home)} .dot.a{background:var(--away)}
.team .sog{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.score{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.02em}
.score span{color:var(--muted);padding-inline:6px}
.score small{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text);font-weight:600;margin-top:4px}

/* Controls */
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 12px;border-radius:7px;color:var(--muted);font-weight:500;min-width:44px}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.seg button.pp[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
.ctl-label{font-size:12px;color:var(--muted);margin-right:6px}
.ctl{display:flex;align-items:center;flex-wrap:wrap;gap:4px}

/* Rink */
.rinkwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.ends{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);padding:2px 4px 8px}
.ends b{color:var(--fg);font-weight:600}
.rink{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.rink.tap{cursor:crosshair}
.hint{font-size:13px;color:var(--muted);text-align:center;padding-top:8px}
.under{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;padding-top:10px}
.under .hint{padding-top:0;text-align:left}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px 6px 6px;font-size:14px;font-weight:500}
.toggle i{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--fg);transition:transform .15s}
.toggle[aria-pressed="true"] i{background:var(--accent)}
.toggle[aria-pressed="true"] i::after{transform:translateX(12px);background:var(--on-accent)}
@media (prefers-reduced-motion: reduce){.toggle i,.toggle i::after{transition:none}}
.slot-sw{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--slot-fill);border:1.5px dashed var(--slot-line)}
@keyframes pulse{0%{r:8;opacity:1}100%{r:22;opacity:0}}
.pend{animation:pulse 1.1s ease-out infinite;fill:none;stroke:var(--mk-ink);stroke-width:2}
@media (prefers-reduced-motion: reduce){.pend{animation:none;r:12}}

.bar-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:16px;height:16px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:500}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:transparent}
.btn.small{padding:6px 10px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* Großfeld: nur das Feld, Bedienknöpfe schweben in den Ecken */
html.lock,html.lock body{overflow:hidden}
.big{position:fixed;inset:0;z-index:15;background:var(--bg);padding:calc(4px + env(safe-area-inset-top,0px)) 4px calc(4px + env(safe-area-inset-bottom,0px))}
.big .rink{display:block;width:100%;height:100%}
.fab{position:absolute;z-index:2;border:1px solid var(--line);background:rgba(23,24,27,.92);color:var(--fg);border-radius:999px;min-width:44px;height:44px;padding:0 14px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.fab.tl{top:calc(10px + env(safe-area-inset-top,0px));left:10px}
.fab.tr{top:calc(10px + env(safe-area-inset-top,0px));right:10px}
.fab.bl{bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px;font-size:13px;font-weight:500;pointer-events:none}
.fab.br{bottom:calc(10px + env(safe-area-inset-bottom,0px));right:10px;font-size:13px}

/* Torbild */
.net{display:block;width:100%;height:auto;max-width:520px;margin:0 auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.net.tap{cursor:crosshair}
.netwrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:640px){.netwrap{grid-template-columns:minmax(0,1fr)}}
.zgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:340px;width:100%;margin:0 auto}
.zgrid div{position:relative;border-radius:8px;background:var(--surface-2);padding:10px 4px;text-align:center;font-variant-numeric:tabular-nums;overflow:hidden}
.zgrid div i{position:absolute;inset:0;background:var(--danger);pointer-events:none}
.zgrid b{position:relative;display:block;font-family:var(--display);font-size:22px;line-height:1}
.zgrid small{position:relative;display:block;color:var(--muted);font-size:11px;margin-top:3px}
.zgrid .zn{position:relative;display:block;font-size:11px;font-weight:600;color:var(--fg);margin-bottom:4px;line-height:1.15;min-height:2.3em;display:flex;align-items:center;justify-content:center}
.zcap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);max-width:320px;margin:6px auto 0}
.hot{font-size:14px;margin:4px 0 0}
.hot b{color:var(--accent-text)}

/* Logo */
.logo{height:36px;width:auto;display:block;flex:none}
.gate-card .logo{height:110px;margin:0 auto 4px}

/* Instagram-Seite (feste Pixelmaße, wird für den Export 1:1 gerendert) */
.igbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end;justify-content:space-between}
.igwrap{position:relative;width:100%;max-width:540px;margin:0 auto;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.igscale{transform-origin:0 0;position:absolute;left:0;top:0}
.igout{display:grid;gap:10px;justify-items:center;text-align:center}
.igout img{width:100%;max-width:540px;border-radius:12px}
.ig{position:relative;width:1080px;height:1350px;background:#0e0f11;color:#f4f1e8;font-family:var(--body);overflow:hidden;display:flex;flex-direction:column;padding:50px 80px 44px;box-sizing:border-box}
.ig.sq{height:1080px;padding:40px 64px 36px}
.ig *{box-sizing:border-box}
.ig-bgc{position:absolute;right:-170px;top:-120px;width:480px;height:480px;border-radius:50%;border:6px solid rgba(245,197,24,.06)}
.ig-top{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.ig-eye{font-family:var(--display);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#f5c518;font-size:30px}
.ig-h1{font-family:var(--display);font-weight:700;font-size:62px;line-height:1;text-transform:uppercase;margin-top:4px}
.ig-h1 em{font-style:normal;color:#f5c518}
.ig-meta{color:#9c9a92;font-size:26px;margin-top:6px}
.ig-logo{height:150px;width:auto;flex:none;margin-top:-6px}
.ig-rink{position:relative;margin-top:28px;background:#17181b;border:1px solid #2d2e33;border-radius:22px;padding:18px 26px 16px}
.ig-rh{display:flex;justify-content:space-between;align-items:center;font-size:20px;color:#9c9a92;margin-bottom:8px}
.ig-rh b{font-family:var(--display);font-weight:700;font-size:25px;letter-spacing:.02em;text-transform:uppercase}
.ig-rh .us{color:#f5c518} .ig-rh .op{color:#c9ccd2}
.ig-rink svg.rk{display:block;width:100%;height:auto}
.ig-leg{display:flex;justify-content:center;gap:30px;margin-top:8px;font-size:18px;color:#9c9a92}
.ig-leg span{display:inline-flex;align-items:center;gap:9px}
.ig-leg svg{width:22px;height:22px}
.ig-cards{position:relative;margin-top:18px;display:grid;grid-template-columns:1.35fr 1fr;gap:24px}
.ig-card{background:#17181b;border:1px solid #2d2e33;border-radius:22px;padding:22px 28px}
.ig-lbl{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:22px;color:#9c9a92}
.ig-row{display:grid;grid-template-columns:110px 1fr 110px;align-items:center;gap:16px;margin-top:10px}
.ig-row .v{font-family:var(--display);font-weight:700;font-size:36px;line-height:1;white-space:nowrap}
.ig-row .v.l{color:#f5c518} .ig-row .v.r{text-align:right;color:#c9ccd2}
.ig-mid{text-align:center;font-size:21px;color:#9c9a92}
.ig-bars{display:grid;grid-template-columns:1fr 1fr;gap:5px;height:10px;margin-top:8px}
.ig-bars i{display:block;background:#222327;border-radius:5px;position:relative;overflow:hidden}
.ig-bars i b{position:absolute;top:0;bottom:0;border-radius:5px}
.ig-bars i:first-child b{right:0;background:#f5c518}
.ig-bars i:last-child b{left:0;background:#c9ccd2}
.ig-per{display:grid;gap:12px;margin-top:16px}
.ig-per div{background:#222327;border-radius:14px;padding:10px 8px;text-align:center}
.ig-per b{display:block;font-family:var(--display);font-weight:700;font-size:32px;line-height:1}
.ig-per b em{font-style:normal;color:#f5c518}
.ig-per small{display:block;font-size:18px;color:#9c9a92;margin-top:6px}
.ig-gk{display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.ig-gkname{font-family:var(--display);font-weight:700;font-size:48px;line-height:1;text-transform:uppercase;margin-top:10px;overflow-wrap:anywhere}
.ig-big{font-family:var(--display);font-weight:700;font-size:100px;line-height:.9;color:#f5c518}
.ig-big small{display:block;font-family:var(--body);font-weight:500;font-size:22px;color:#9c9a92;margin-top:8px}
.ig-gkl{display:flex;gap:28px}
.ig-gkl div{font-family:var(--display);font-weight:700;font-size:40px;line-height:1}
.ig-gkl small{display:block;font-family:var(--body);font-weight:500;font-size:20px;color:#9c9a92;margin-top:6px}
.ig-gks{display:grid;gap:14px;margin-top:12px}
.ig-g{border-top:1px solid #2d2e33;padding-top:14px}
.ig-g:first-child{border-top:0;padding-top:0}
.ig-g .n{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ig-g .n b{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;text-transform:uppercase;overflow-wrap:anywhere}
.ig-g .n em{font-style:normal;font-family:var(--display);font-weight:700;font-size:44px;color:#f5c518;line-height:1;white-space:nowrap}
.ig-g small{display:block;font-size:19px;color:#9c9a92;margin-top:6px}
.ig-foot{position:relative;margin-top:auto;padding-top:14px;display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:22px}
.ig-foot span{color:#9c9a92;font-family:var(--body);font-weight:500;letter-spacing:0;text-transform:none}
/* quadratisch: kompakter */
.ig.sq .ig-h1{font-size:50px}.ig.sq .ig-eye{font-size:24px}.ig.sq .ig-meta{font-size:22px}.ig.sq .ig-logo{height:112px}
.ig.sq .ig-rink{margin-top:16px;padding:12px 80px 10px}.ig.sq .ig-rh{font-size:17px;margin-bottom:4px}.ig.sq .ig-rh b{font-size:21px}.ig.sq .ig-leg{font-size:16px;margin-top:4px}
.ig.sq .ig-cards{margin-top:14px;gap:18px}.ig.sq .ig-card{padding:16px 24px}.ig.sq .ig-lbl{font-size:18px}
.ig.sq .ig-row{margin-top:6px;grid-template-columns:96px 1fr 96px}.ig.sq .ig-row .v{font-size:30px}.ig.sq .ig-mid{font-size:18px}.ig.sq .ig-bars{height:8px;margin-top:5px}
.ig.sq .ig-per{margin-top:10px;gap:8px}.ig.sq .ig-per div{padding:6px}.ig.sq .ig-per b{font-size:26px}.ig.sq .ig-per small{font-size:15px;margin-top:3px}
.ig.sq .ig-gkname{font-size:40px}.ig.sq .ig-big{font-size:78px}.ig.sq .ig-big small{font-size:18px}.ig.sq .ig-gkl div{font-size:32px}.ig.sq .ig-gkl small{font-size:16px}
.ig.sq .ig-g .n b{font-size:30px}.ig.sq .ig-g .n em{font-size:34px}.ig.sq .ig-g small{font-size:16px}.ig.sq .ig-gks{gap:10px}.ig.sq .ig-g{padding-top:10px}
.ig.sq .ig-foot{display:none}

/* Recent shots */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.recent{list-style:none;margin:8px 0 0;padding:0 4px 0 0;display:grid;max-height:320px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.recent li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding-block:7px;border-top:1px solid var(--line);font-size:14px}
.recent li:first-child{border-top:0}
.recent li>svg{width:18px;height:18px}
.ic{width:18px;height:18px;flex:none}
.recent .x{border:0;background:transparent;color:var(--muted);font-size:18px;padding:0 6px;line-height:1}
.recent .meta{color:var(--muted);font-size:13px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.35)}
.sheet-in{max-width:640px;margin:0 auto;display:grid;gap:12px}
.sheet h3{margin:0;font-family:var(--display);font-size:20px}
.sheet .sub{color:var(--muted);font-size:13px}
.teamsel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.teamsel button{border:1px solid var(--line);background:var(--surface-2);padding:10px;border-radius:10px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center;min-width:0;overflow-wrap:anywhere}
.teamsel button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.gkrow{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.gkbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;display:inline-flex;align-items:center;gap:8px;font-weight:500;min-width:0;max-width:100%;text-align:left}
.gkbtn b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gkbtn .swap{color:var(--accent-text);font-weight:600;flex:none}
.gkbtn.unset b{color:var(--muted);font-weight:500}
.gklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.gklist button{border:1px solid var(--line);background:var(--surface-2);padding:12px 10px;border-radius:10px;font-weight:600;overflow-wrap:anywhere}
.gklist button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.gklist button.en{font-weight:500;color:var(--muted)}
.gklist button.en[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.gkadd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.gkname{border:0;background:none;padding:0;font-weight:600;display:inline-flex;align-items:center;gap:8px;text-align:left}
tr.pick td{cursor:pointer}
tr.on td{background:var(--surface-2)}
.filterchip{display:inline-flex;align-items:center;gap:8px;font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px}
.filterchip button{border:0;background:var(--line);color:var(--fg);width:22px;height:22px;border-radius:50%;line-height:1}
.results{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.results button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:14px 6px;display:grid;justify-items:center;gap:6px;font-weight:600;font-size:14px}
.results button svg{width:26px;height:26px}
.results button.goal{background:var(--gc);color:var(--on-mark);border-color:transparent}
.sitsel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sitsel button{border:1px solid var(--line);background:var(--surface-2);padding:9px 6px;border-radius:10px;font-weight:600;font-size:14px}
.sitsel button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:transparent}
.sitsel button.pp[aria-pressed="true"]{background:var(--pp);color:var(--on-mark)}
.sitsel button.sh[aria-pressed="true"]{background:var(--sh);color:var(--on-mark)}
.sheet .lbl{font-size:12px;color:var(--muted);margin-bottom:-6px}
@media (max-width:420px){.results{grid-template-columns:repeat(2,1fr)}}

/* Stats */
.statgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.statgrid{grid-template-columns:minmax(0,1fr)}}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 6px;text-align:center;border-top:1px solid var(--line)}
th{font-weight:500;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;border-top:0;hyphens:manual}
td:first-child,th:first-child{text-align:left}
tr.sel td{background:var(--surface-2)}
tr.tot td{font-weight:600;border-top:2px solid var(--line)}
.cmp{display:grid;gap:12px;margin-top:10px}
.cmp-row{display:grid;grid-template-columns:68px 1fr 68px;gap:10px;align-items:center}
.cmp-row .v{font-family:var(--display);font-weight:600;font-size:19px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cmp-row .v.r{text-align:right}
.cmp-mid{display:grid;gap:4px;text-align:center;font-size:13px;color:var(--muted)}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:3px;height:6px}
.twin i{display:block;height:100%;border-radius:3px;background:var(--surface-2);position:relative;overflow:hidden}
.twin i b{position:absolute;top:0;bottom:0;border-radius:3px}
.twin i:first-child b{right:0;background:var(--home)}
.twin i:last-child b{left:0;background:var(--away)}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.head .when{color:var(--muted);font-size:14px}
select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;max-width:100%}

/* Archive */
.games{display:grid;gap:10px}
.game{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.game .teams{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.game .res{font-family:var(--display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;text-align:right}
.game .res small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
.game .info{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.game .btns{grid-column:1/-1}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h2{color:var(--fg);margin-bottom:8px}

/* Forms */
form{display:grid;gap:14px;max-width:640px}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:520px){.fields{grid-template-columns:minmax(0,1fr)}}
label{display:grid;gap:5px;font-size:13px;color:var(--muted);min-width:0}
input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0;max-width:100%;color:var(--fg);font-size:16px}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-height:46px;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
textarea{min-height:110px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;resize:vertical}
.note{font-size:13px;color:var(--muted);max-width:62ch}
.msg{font-size:14px;min-height:1.4em}
.msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}

/* Settings */
.set{display:grid;gap:16px;max-width:760px}
.set .panel{display:grid;gap:12px}
.set h3{margin:0;font-family:var(--display);font-size:20px}
.mem{list-style:none;margin:0;padding:0;display:grid}
.mem li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.mem li:first-child{border-top:0}
.mem .who{min-width:0;overflow-wrap:anywhere}
.mem .who small{display:block;color:var(--muted);font-size:12px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}

/* Gate (Login / Freischaltung) */
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px 16px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.gate-card{width:100%;max-width:380px;display:grid;gap:14px}
.gate-card .brand{justify-content:center;margin-bottom:6px}
.gate-card h2{text-align:center}
.gate-card p{margin:0;color:var(--muted);text-align:center}
.gate-card form{gap:10px}
.gate-card .btn{width:100%;padding:12px}
.linkbtn{border:0;background:none;color:var(--accent-text);font-weight:500;padding:6px}

.sn{display:none}
@media (max-width:560px){
  .fn{display:none}.sn{display:inline}
  .score{font-size:32px}
  .team .nm{font-size:15px}
  .board{padding:12px;gap:8px}
  .team .sog{font-size:12px}
  .seg button{padding:7px 9px;font-size:14px}
  .tab{padding:7px 8px;font-size:14px;white-space:nowrap}
  nav{flex-wrap:nowrap;width:100%;justify-content:space-between;gap:2px}
  .top{gap:8px}
  .cmp-row{grid-template-columns:58px 1fr 58px}
  .cmp-row .v{font-size:17px}
  .mem li{grid-template-columns:minmax(0,1fr)}
  .hide-sm{display:none}
  th{letter-spacing:.03em}
}
</style>
</head>

/* ---------- Beispieldaten (nur Demo) ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genShot(r,team,p,ts){
  const d=2+Math.pow(r(),1.3)*15, a=(r()*2-1)*1.15;
  let x=560-d*10*Math.cos(a), y=150+d*10*Math.sin(a);
  y=Math.max(18,Math.min(282,y)); x=Math.max(380,Math.min(588,x));
  const pg=d<6?.24:d<12?.12:.04, q=r();
  const res=q<pg?'G':q<pg+.52?'S':q<pg+.78?'M':'B';
  const sq=r(), s=sq<.12?'PP':sq<.16?'SH':'EV';
  if(team==='A'){x=600-x;y=300-y}
  const o={id:uid(),t:team,x:+x.toFixed(1),y:+y.toFixed(1),p,r:res,s,ts};
  if(res==='G'){const q2=r();if(q2<.6){o.nx=+(r()<.5?.04+r()*.25:.71+r()*.25).toFixed(3);o.ny=+(.05+r()*.3).toFixed(3)}else if(q2<.8){o.nx=+(.42+r()*.16).toFixed(3);o.ny=+(.78+r()*.18).toFixed(3)}else{o.nx=+(r()<.5?.05+r()*.28:.67+r()*.28).toFixed(3);o.ny=+(.75+r()*.2).toFixed(3)}}
  else if(res==='S'){o.nx=+(.15+r()*.7).toFixed(3);o.ny=+(.12+r()*.8).toFixed(3)}
  return o;
}
function mkGame(meta,spec,seed){
  const r=rng(seed), shots=[]; let ts=1;
  Object.keys(spec).forEach(p=>{const [h,a]=spec[p];const list=[];for(let i=0;i<h;i++)list.push('H');for(let i=0;i<a;i++)list.push('A');
    list.sort(()=>r()-.5).forEach(t=>shots.push(genShot(r,t,+p,ts++)));});
  const gl=meta.goalies, sw=meta.sw||{}; delete meta.sw;
  if(gl)shots.forEach(s=>{const d=s.t==='H'?'A':'H';if(!gl[d]||!gl[d].length)return;s.gk=(sw[d]&&s.p>=sw[d].p)?sw[d].n:gl[d][0]});
  const extra=gl?{gk:{H:sw.H&&meta.period!==undefined&&meta.period<sw.H.p?gl.H[0]:(sw.H?sw.H.n:gl.H[0]),A:sw.A?sw.A.n:gl.A[0]},
    gkLog:['H','A'].flatMap(t=>[{t,n:gl[t][0],p:1,ts:1}].concat(sw[t]?[{t,n:sw[t].n,p:sw[t].p,ts:2}]:[]))}:{};
  return Object.assign({id:uid(),homeDirP1:'right',period:1,situation:'EV',status:'final',example:true,shots,updatedAt:1},extra,meta);
}

let S={games:[],currentId:null,lastHome:null};
let sb=null, me=null, member=null, members=[], started=false;
const queue=new Set(), dels=new Set();
let flushing=false, syncState=CLOUD?'wait':'demo';

function initStore(){
  if(!CLOUD){
    const d=ls.get(KEY);
    S=(d&&Array.isArray(d.games))?d:seed();
    S.games.forEach(g=>['home','away'].forEach(k=>{if(g[k]==='EC Zirl Gunners')g[k]=HOME_DEFAULT}));
    if(S.lastHome==='EC Zirl Gunners')S.lastHome=HOME_DEFAULT;
    members=DEMO_MEMBERS.map(m=>Object.assign({},m)); me={id:'d1',email:'du@beispiel.at'}; member=members[0];
    return;
  }
  const c=ls.get(CACHE)||{}, p=ls.get(PREF)||{};
  S.games=Array.isArray(c.games)?c.games:[];
  (c.queue||[]).forEach(id=>queue.add(id)); (c.dels||[]).forEach(id=>dels.add(id));
  S.currentId=p.currentId||null; S.lastHome=p.lastHome||null; S.lastGk=p.lastGk||'';
}
function persist(){
  if(!CLOUD){ls.set(KEY,S);return}
  ls.set(CACHE,{games:S.games,queue:[...queue],dels:[...dels],member:member?{approved:member.approved,role:member.role,user_id:member.user_id}:null});
  ls.set(PREF,{currentId:S.currentId,lastHome:S.lastHome,lastGk:S.lastGk||''});
}
function commit(...gs){
  gs.filter(Boolean).forEach(g=>{g.updatedAt=Date.now();if(CLOUD)queue.add(g.id)});
  persist(); if(CLOUD){setSync('wait');flush()}
}
function removeGame(id){S.games=S.games.filter(g=>g.id!==id);if(CLOUD){queue.delete(id);dels.add(id)}persist();if(CLOUD)flush()}
async function flush(){
  if(!CLOUD||!sb||flushing||!member||!member.approved)return;
  if(!queue.size&&!dels.size){setSync('ok');return}
  flushing=true; let failed=false;
  for(const id of [...queue]){
    const g=byId(id); if(!g){queue.delete(id);continue}
    const sent=g.updatedAt;
    const {error}=await sb.from('sm_games').upsert({id:g.id,data:JSON.parse(JSON.stringify(g))});
    if(error){failed=true;break}
    if((byId(id)||{}).updatedAt===sent)queue.delete(id);
  }
  if(!failed)for(const id of [...dels]){
    const {error}=await sb.from('sm_games').delete().eq('id',id);
    if(error){failed=true;break} dels.delete(id);
  }
  flushing=false; persist();
  setSync(failed?'err':(queue.size||dels.size)?'wait':'ok');
  if(!failed&&(queue.size||dels.size))setTimeout(flush,300);
}
async function loadGames(){
  const {data,error}=await sb.from('sm_games').select('id,data');
  if(error){setSync('err');return false}
  const server=data.map(r=>r.data).filter(Boolean);
  const local=S.games.filter(g=>queue.has(g.id));
  S.games=server.filter(g=>!queue.has(g.id)&&!dels.has(g.id)).concat(local);
  persist(); return true;
}
function onRemote(pl){
  if(pl.eventType==='DELETE'){const id=pl.old&&pl.old.id;if(!id)return;S.games=S.games.filter(g=>g.id!==id)}
  else{
    const row=pl.new; if(!row||!row.data||queue.has(row.id)||dels.has(row.id))return;
    const i=S.games.findIndex(g=>g.id===row.id);
    if(i<0)S.games.push(row.data);
    else if((row.data.updatedAt||0)>=(S.games[i].updatedAt||0))S.games[i]=row.data; else return;
  }
  persist(); if(started&&ui.view!=='new'&&ui.view!=='settings')render();
}
let channel=null;
function subscribe(){
  if(channel)return;
  channel=sb.channel('sm_games_live').on('postgres_changes',{event:'*',schema:'public',table:'sm_games'},onRemote)
    .subscribe(st=>{if(st==='SUBSCRIBED')setSync(queue.size||dels.size?'wait':'ok');else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')setSync('err')});
}
async function refresh(){if(!CLOUD||!sb||!member||!member.approved)return;await flush();if(await loadGames()&&started&&ui.view!=='new'&&ui.view!=='settings')render()}
function setSync(st){
  syncState=st;const el=document.getElementById('sync');if(!el)return;
  const txt={demo:'Demo · nur auf diesem Gerät',ok:'Live verbunden',wait:'Speichert …',err:'Offline · wird nachgeladen'}[st];
  el.className='sync '+(st==='demo'?'':st); el.textContent=txt;
}

function authErr(m){
  m=String(m||'');
  if(/invalid login/i.test(m))return 'E-Mail oder Passwort stimmt nicht.';
  if(/already registered|already exists/i.test(m))return 'Diese E-Mail ist schon registriert. Melde dich einfach an.';
  if(/at least 6|password should/i.test(m))return 'Das Passwort braucht mindestens 6 Zeichen.';
  if(/email not confirmed/i.test(m))return 'Bitte bestätige zuerst deine E-Mail-Adresse.';
  if(/fetch|network/i.test(m))return 'Keine Verbindung. Prüf dein Internet und versuch es nochmal.';
  return m;
}

function hideGate(){gate.hidden=true;gate.innerHTML='';document.getElementById('app').hidden=false}
gate.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;if(f.id!=='authform')return;

async function afterLogin(user,recheck){
  me=user; if(!recheck)showGate('loading');
  let {data,error}=await sb.from('sm_members').select('*').eq('user_id',user.id).maybeSingle();
  if(error){
    const c=ls.get(CACHE); // offline: mit zwischengespeichertem Stand starten
    if(c&&c.member&&c.member.approved&&c.member.user_id===user.id){member=c.member;hideGate();start();setSync('err');return}
    showGate(recheck?'pending':'login',authErr(error.message));return;
  }
  if(!data){
    const ins=await sb.from('sm_members').insert({user_id:user.id,email:user.email}).select().maybeSingle();
    data=ins.data||{user_id:user.id,email:user.email,approved:false,role:'member'};
  }
  member=data; persist();
  if(!member.approved){showGate('pending',recheck?'Noch nicht freigeschaltet.':'');return}
  hideGate(); await flush(); await loadGames(); subscribe(); if(member.role==='admin')loadMembers(); start();
}

/* ---------- Logik ---------- */
const ui={igFmt:'p',igImg:null,netT:'H',netRes:'sog',fGk:'all',gkSheet:null,showSlot:!!ls.get('shotmap_slot'),view:'live',liveScope:'period',fRes:'all',statsId:null,fPer:'all',fColor:'team',pending:null,armed:null,newDir:'right',setMsg:null,restoreMsg:null};

const byId=id=>S.games.find(g=>g.id===id);
// Heim greift in Drittel 1 und 3 in Richtung homeDirP1 an, in 2 und OT umgekehrt
const homeDir=(g,p)=>(p===1||p===3)?g.homeDirP1:(g.homeDirP1==='right'?'left':'right');
// Gespeichert wird normalisiert: Heim greift immer rechts an. Anzeige dreht bei Bedarf um 180°.
const rot=(x,y,flip)=>flip?[600-x,300-y]:[x,y];
// Slot ("Home Plate"): Torpfosten → Bullypunkte → Oberkante der Bullykreise. Links = Tor links, rechts gespiegelt.
const SLOT_L=[[40,141],[100,80],[145,80],[145,220],[100,220],[40,159]];
const SLOT_R=SLOT_L.map(([x,y])=>[600-x,y]);
function inPoly(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const [xi,yi]=P[i],[xj,yj]=P[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c}
const inSlot=s=>inPoly(s.x,s.y,s.t==='H'?SLOT_R:SLOT_L);
const situationFor=(g,team)=>g.situation==='EV'?'EV':((g.situation==='PPH')===(team==='H')?'PP':'SH');
const dist=s=>{const tx=s.t==='H'?560:40;return Math.hypot(s.x-tx,s.y-150)/10};
function tally(shots){
  const o={H:blank(),A:blank()};
  shots.forEach(s=>{const t=o[s.t];t.att++;if(s.r==='G'||s.r==='S')t.sog++;if(s.r==='G')t.g++;
    if(s.s==='PP'&&s.r==='G')t.ppG++;
    if(s.s==='SH'&&s.r==='G')t.shG++; t.dsum+=dist(s);
    const d=dist(s), b=d<6?0:d<12?1:2; t.bk[b][0]++; if(s.r==='G')t.bk[b][1]++;
    if(inSlot(s)){t.slot[0]++;if(s.r==='G')t.slot[1]++}});
  return o;
  function blank(){return{att:0,sog:0,g:0,ppG:0,shG:0,dsum:0,bk:[[0,0],[0,0],[0,0]],slot:[0,0]}}
}
const pct=(a,b)=>b?Math.round(a/b*1000)/10:null;
/* Torhüter: g.goalies={H:[..],A:[..]}, g.gk={H:name,A:name} (''=leeres Tor), jeder Schuss merkt sich s.gk = Goalie im Tor */
const opp=t=>t==='H'?'A':'H';
const gkList=(g,t)=>(g.goalies&&g.goalies[t])||[];
const gkCur=(g,t)=>{const v=g.gk?g.gk[t]:undefined;if(v!==undefined&&v!==null)return v;const l=gkList(g,t);return l.length?l[0]:undefined};
const gkName=v=>v===''?'Leeres Tor':v;
const facing=(g,shooter)=>gkCur(g,opp(shooter));
// Alle Goalies eines Spiels (aus der Liste und aus erfassten Schüssen), je Team
function gkAll(g){const out=[];['H','A'].forEach(t=>{const names=gkList(g,t).slice();
  g.shots.forEach(s=>{if(s.t===opp(t)&&s.gk!==undefined&&!names.includes(s.gk))names.push(s.gk)});
  names.forEach(n=>out.push({t,n,key:t+'|'+n}))});return out}
function gkStat(g,t,n,shots){const on=(shots||g.shots).filter(s=>s.t===opp(t)&&s.gk===n);
  const sog=on.filter(s=>s.r==='G'||s.r==='S').length, ga=on.filter(s=>s.r==='G').length;
  const per=[...new Set(on.map(s=>s.p).concat((g.gkLog||[]).filter(l=>l.t===t&&l.n===n).map(l=>l.p)))].sort();
  return {sog,ga,sv:sog-ga,pct:n===''?null:pct(sog-ga,sog),per}}
/* Torbild: Sicht des Schützen von vorne. Öffnung 180×120 (≈183×122 cm). nx/ny = 0..1 in der Öffnung */
const NX0=10,NY0=12,NW=180,NH=120;
// Zonen wie im Eishockey (Sicht des Schützen). Zeilen: oben <40 %, halbhoch bis 72 %, unten.
// Spaltengrenzen je Zeile: Kreuzecke breiter oben, Five Hole schmal zwischen den Schonern.
const ZROW=[.4,.72], ZCOL=[[.33,.67],[.3,.7],[.38,.62]];
const ZN=[['Kreuzeck links','Oben Mitte','Kreuzeck rechts'],['Halbhoch links','Körper','Halbhoch rechts'],['Schoner links','Five Hole','Schoner rechts']];
// wichtige Zonen farbig: Kreuzecke gelb, Schoner blau, Five Hole rot
const ZC=[['var(--accent)',null,'var(--accent)'],[null,null,null],['var(--away)','var(--home)','var(--away)']];
const zoneOf=s=>{const ri=s.ny<ZROW[0]?0:s.ny<ZROW[1]?1:2;const c=ZCOL[ri];return [ri,s.nx<c[0]?0:s.nx<c[1]?1:2]};
const zoneName=s=>{const [ri,ci]=zoneOf(s);return ZN[ri][ci]};
function netSVG(id,marks,tap,labels){
  const x0=NX0,y0=NY0,x1=NX0+NW,y1=NY0+NH,r=18;
  const frame=`M${x0} ${y1}V${y0+r}Q${x0} ${y0} ${x0+r} ${y0}H${x1-r}Q${x1} ${y0} ${x1} ${y0+r}V${y1}`;
  const ys=[y0,y0+ZROW[0]*NH,y0+ZROW[1]*NH,y1];
  const zones=ZN.map((row,ri)=>row.map((n,ci)=>{const c=ZCOL[ri],xs=[x0,x0+c[0]*NW,x0+c[1]*NW,x1];
    const X=xs[ci],W=xs[ci+1]-xs[ci],Y=ys[ri],H=ys[ri+1]-ys[ri],col=ZC[ri][ci];
    return (col?`<rect x="${X}" y="${Y}" width="${W}" height="${H}" fill="${col}" opacity=".17"/>`:'')+
      `<rect x="${X}" y="${Y}" width="${W}" height="${H}" fill="none" stroke="var(--rink-blue)" stroke-width=".7" stroke-dasharray="3 3"/>`+
      (labels?(()=>{const w=n.split(' ');const two=w.length>1&&n!=='Five Hole';const fs=6.6;
        return `<text x="${X+W/2}" y="${Y+H/2+(two?-1.2:2.4)}" text-anchor="middle" font-size="${fs}" font-family="var(--body)" font-weight="600" fill="var(--mk-ink)" opacity=".55">${two?`<tspan x="${X+W/2}">${w[0]}</tspan><tspan x="${X+W/2}" dy="${fs+1}">${w.slice(1).join(' ')}</tspan>`:n}</text>`})():'')}).join('')).join('');
  return `<svg id="${id}" class="net${tap?' tap':''}" viewBox="0 0 200 146" role="img" aria-label="Eishockeytor von vorne">
  <defs>
    <pattern id="${id}-m" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0H8M0 0V8" stroke="var(--mesh)" stroke-width=".7" fill="none"/></pattern>
    <clipPath id="${id}-c"><path d="${frame}Z"/></clipPath>
    <linearGradient id="${id}-d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d6672" stop-opacity=".14"/><stop offset=".35" stop-color="#5d6672" stop-opacity="0"/></linearGradient>
  </defs>

function netPanel(g,selGk){
  // Welches Tor: gewählter Goalie, sonst Umschalter (Heimtor = Schüsse des Gastes)
  const t=selGk?selGk.t:ui.netT;
  let on=g.shots.filter(s=>s.t===opp(t)&&(s.r==='G'||s.r==='S'));
  if(selGk)on=on.filter(s=>s.gk===selGk.n);
  if(ui.fPer!=='all')on=on.filter(s=>s.p===+ui.fPer);
  const withNet=on.filter(s=>s.nx!==undefined), shown=withNet.filter(s=>ui.netRes==='sog'||s.r==='G');
  const marks=shown.slice().sort((a,b)=>(a.r==='G')-(b.r==='G')).map(s=>{const [x,y]=netXY(s);return shape(s.r,x,y,col(s,'team'),.75,halo(s,'team'))}).join('');
  const Z=[[0,0],[0,0],[0,0]].map(()=>[[0,0],[0,0],[0,0]]);
  withNet.forEach(s=>{const [ri,ci]=zoneOf(s);Z[ri][ci][0]++;if(s.r==='G')Z[ri][ci][1]++});
  const maxG=Math.max(1,...Z.flat().map(z=>z[1]));
  const topG=Math.max(0,...Z.flat().map(z=>z[1]));const hotZ=[];if(topG)Z.forEach((row,ri)=>row.forEach((z,ci)=>{if(z[1]===topG)hotZ.push(ZN[ri][ci])}));
  const teamName=t==='H'?g.home:g.away;
  const who=selGk?`Schüsse auf ${esc(gkName(selGk.n))}`:`Schüsse auf das Tor von ${esc(short(teamName))}`;
  const tb=(v,l)=>`<button data-act="nett" data-v="${v}" aria-pressed="${ui.netT===v}">${l}</button>`;
  const rb=(v,l)=>`<button data-act="netres" data-v="${v}" aria-pressed="${ui.netRes===v}">${l}</button>`;
  const missing=on.length-withNet.length;
  return `<section class="panel"><div class="bar-row"><div class="eyebrow">Torbild · ${who}</div></div>
    <div class="controls" style="margin-top:8px">${selGk?'<span class="note">Gefiltert nach Torhüter. Filter oben entfernen, um zwischen den Toren zu wechseln.</span>':`<div class="seg">${tb('H','Tor '+esc(short(g.home)))}${tb('A','Tor '+esc(short(g.away)))}</div>`}<div class="seg">${rb('sog','Aufs Tor')}${rb('G','Nur Tore')}</div></div>
    <div class="netwrap" style="margin-top:12px">
      <div>${netSVG('stats-net',marks,false)}<div class="zcap" style="max-width:520px"><span>◀ links</span><span>Sicht des Schützen</span><span>rechts ▶</span></div></div>
      <div><div class="zgrid">${Z.map((row,ri)=>row.map((z,ci)=>`<div${ZC[ri][ci]?` style="box-shadow:inset 0 3px 0 ${ZC[ri][ci]}"`:''}><i style="opacity:${z[1]?(.15+.55*z[1]/maxG).toFixed(2):0}"></i><span class="zn">${ZN[ri][ci]}</span><b>${z[1]}</b><small>${z[0]} aufs Tor</small></div>`).join('')).join('')}</div>
        <div class="zcap"><span>Tore pro Zone</span><span>${withNet.length} Schüsse mit Torbild</span></div>
        ${hotZ.length?`<p class="hot">Die meisten Gegentore: <b>${hotZ.join(', ')}</b> (${hotZ.length>1?'je ':''}${topG})</p>`:'<p class="note">Noch keine Tore mit Torbild.</p>'}
        ${missing?`<p class="note" style="margin:4px 0 0">${missing} ${missing===1?'Schuss':'Schüsse'} ohne Torbild erfasst.</p>`:''}
      </div>
    </div></section>`;
}

const isUs=n=>/gunners/i.test(n||'')||n===HOME_DEFAULT||(S.lastHome&&n===S.lastHome);
function season(d){const [y,m]=(d||today()).split('-').map(Number);return m>=7?`${y}/${String((y+1)%100).padStart(2,'0')}`:`${y-1}/${String(y%100).padStart(2,'0')}`}
function igShape(r,x,y,c,k){k=k||1;const ink='#15181d';
  if(r==='G')return `<circle cx="${x}" cy="${y}" r="${9*k}" fill="none" stroke="${c}" stroke-width="${3.4*k}"/><circle cx="${x}" cy="${y}" r="${3.6*k}" fill="${c}"/>`;
  if(r==='S')return `<circle cx="${x}" cy="${y}" r="${6.5*k}" fill="${c}" stroke="${ink}" stroke-width="1.6"/>`;
  if(r==='B')return `<path d="M${x} ${y-6.5*k}L${x+6*k} ${y+4.8*k}L${x-6*k} ${y+4.8*k}Z" fill="${c}" stroke="${ink}" stroke-width="1.4"/>`;
  return `<circle cx="${x}" cy="${y}" r="${5.8*k}" fill="none" stroke="${c}" stroke-width="${2.4*k}"/>`}
function igRink(shots,us){
  // feste Farben (kein CSS-Var), damit der Bild-Export das Feld korrekt zeichnet
  const R='#e3a4aa',B='#a9bde3',circ=(x,y)=>`<circle cx="${x}" cy="${y}" r="45" fill="none" stroke="${R}" stroke-width="1.6"/><circle cx="${x}" cy="${y}" r="3.2" fill="${R}"/>`;
  const fl=us==='A';
  const marks=shots.slice().sort((a,b)=>(a.r==='G')-(b.r==='G')).map(s=>{const x=fl?600-s.x:s.x,y=fl?300-s.y:s.y;return igShape(s.r,x,y,s.t===us?'#d4a400':'#3d4350')}).join('');
  return `<svg class="rk" viewBox="-6 -6 612 312" xmlns="http://www.w3.org/2000/svg" width="1224" height="624"><defs><clipPath id="igc"><rect width="600" height="300" rx="85"/></clipPath></defs>
  <rect width="600" height="300" rx="85" fill="#eef2f5"/><g clip-path="url(#igc)">
  <line x1="40" y1="0" x2="40" y2="300" stroke="${R}" stroke-width="1.5"/><line x1="560" y1="0" x2="560" y2="300" stroke="${R}" stroke-width="1.5"/>
  <rect x="227" y="0" width="3" height="300" fill="${B}"/><rect x="370" y="0" width="3" height="300" fill="${B}"/><rect x="298.5" y="0" width="3" height="300" fill="${R}"/>
  <circle cx="300" cy="150" r="45" fill="none" stroke="${B}" stroke-width="1.6"/>${circ(100,80)}${circ(100,220)}${circ(500,80)}${circ(500,220)}
  <path d="M40 132A18 18 0 0 1 40 168Z" fill="#dde8f5" stroke="${R}"/><path d="M560 132A18 18 0 0 0 560 168Z" fill="#dde8f5" stroke="${R}"/></g>
  <rect width="600" height="300" rx="85" fill="none" stroke="#5d6068" stroke-width="4"/>${marks}</svg>`}
function postHTML(g,fmt){
  const us=isUs(g.home)?'H':isUs(g.away)?'A':'H', th=opp(us);
  const usName=us==='H'?g.home:g.away, thName=us==='H'?g.away:g.home;

  const row=(l,a,b,f)=>{f=f||(v=>v==null?'–':v);return `<div class="ig-row"><div class="v l">${f(a)}</div><div class="ig-mid">${l}${bar(a,b)}</div><div class="v r">${f(b)}</div></div>`};

  const gks=gkAll(g).filter(x=>x.t===us&&x.n!=='').map(x=>Object.assign({},x,gkStat(g,x.t,x.n))).filter(x=>x.sog>0||gkList(g,us).length===1);
  let gk;

      <div class="ig-per" style="grid-template-columns:repeat(${ps.length},1fr)">${per}</div></div>${gk}</div>
    <div class="ig-foot"><div>${esc(usName)}</div><span>Saison ${season(g.date)}</span></div></div>`;
}

async function savePost(btn){

    const url=cv.toDataURL('image/png');
    ui.igImg={id:g.id+ui.igFmt,url};
    const name=`gunners-statistik-${g.date||'spiel'}.png`;
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
    let shared=false;
    try{const file=new File([blob],name,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});shared=true}}catch(e){if(e&&e.name==='AbortError')shared=true}
    if(!shared){try{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}}
    const out=document.getElementById('igout');if(out)out.innerHTML=`<img src="${url}" alt="Instagram-Bild"><p class="note">${shared?'Bild geteilt.':'Falls kein Download startet: Bild gedrückt halten und „In Fotos sichern“ wählen.'}</p>`;
  }catch(e){const out=document.getElementById('igout');if(out)out.innerHTML=`<p class="msg err">Das Bild konnte nicht erstellt werden. Mach alternativ einen Screenshot der Vorschau.</p>`}
  finally{box.remove();btn.disabled=false;btn.textContent=old}
}
function backupCode(){return JSON.stringify({app:'shotmap',v:1,exportedAt:new Date().toISOString(),games:S.games})}
function vSettings(){
  const adm=isAdmin();
  const roleTxt=member?(member.role==='admin'?'Admin':'Mitglied'):'–';
  const memRow=m=>{const self=me&&m.user_id===me.id;
    const st=!m.approved?'<span class="chip wait">Wartet</span>':m.role==='admin'?'<span class="chip adm">Admin</span>':'<span class="chip ok">Freigeschaltet</span>';
    const acts=self?'<span class="note">Das bist du</span>':[
      !m.approved?`<button class="btn primary small" data-act="mset" data-id="${m.user_id}" data-k="approve">Freischalten</button>`:`<button class="btn small danger" data-act="mset" data-id="${m.user_id}" data-k="block">Sperren</button>`,
      m.approved&&m.role!=='admin'?`<button class="btn small" data-act="mset" data-id="${m.user_id}" data-k="admin">Zum Admin machen</button>`:'',
      m.role==='admin'?`<button class="btn small" data-act="mset" data-id="${m.user_id}" data-k="member">Admin entfernen</button>`:''].join('');
    return `<li><div class="who">${esc(m.email||'(ohne E-Mail)')} ${st}<small>registriert ${m.created_at?fmtDate(String(m.created_at).slice(0,10)):''}${CLOUD?'':' · Beispiel'}</small></div><div class="btns">${acts}</div></li>`};
  main.innerHTML=`<div><div class="eyebrow">Einstellungen</div><h2>Konto, Mitglieder &amp; Daten</h2></div>
  <div class="set">
    <section class="panel"><h3>Konto</h3>
      <dl class="kv"><dt>Angemeldet als</dt><dd>${esc(me?me.email:'–')}</dd><dt>Rolle</dt><dd>${roleTxt}</dd><dt>Speicher</dt><dd>${CLOUD?'Online · alle Geräte sehen dieselben Spiele live':'Demo · Daten nur auf diesem Gerät'}</dd></dl>
      ${CLOUD?'<div class="btns"><button class="btn" data-act="logout">Abmelden</button></div>':''}
    </section>
    ${adm?`<section class="panel"><div class="bar-row"><h3>Mitglieder freischalten</h3><button class="btn small" data-act="mreload">Aktualisieren</button></div>
      <p class="note" style="margin:0">Wer sich registriert, landet hier mit „Wartet“. Freigeschaltete Mitglieder können Spiele erfassen und ansehen, Admins zusätzlich Mitglieder verwalten.</p>
      ${members.length?`<ul class="mem">${members.map(memRow).join('')}</ul>`:'<p class="note">Noch keine Registrierungen.</p>'}
      ${ui.setMsg?`<div class="msg ${ui.setMsg.t}">${esc(ui.setMsg.m)}</div>`:''}
    </section>`:''}
    <section class="panel"><h3>Daten sichern</h3>
      <p class="note" style="margin:0">Das ist der Sicherungscode mit ${S.games.length===1?'dem gespeicherten Spiel':'allen '+S.games.length+' Spielen'}. Kopier ihn z. B. in eine Notiz, dann kannst du alles jederzeit wiederherstellen.</p>
      <textarea id="bk-out" readonly>${esc(backupCode())}</textarea>
      <div class="btns"><button class="btn" data-act="copy">Code kopieren</button></div>
    </section>
    <section class="panel"><h3>Wiederherstellen</h3>
      <p class="note" style="margin:0">Füg einen Sicherungscode ein. Spiele mit gleicher Kennung werden überschrieben, alle anderen bleiben erhalten.</p>
      <textarea id="bk-in" placeholder="Sicherungscode hier einfügen"></textarea>
      <div class="btns"><button class="btn primary" data-act="restore">Code einspielen</button></div>
      <div class="msg ${ui.restoreMsg?ui.restoreMsg.t:''}" id="bk-msg">${ui.restoreMsg?esc(ui.restoreMsg.m):''}</div>
    </section>
  </div>`;
}

function sheet(){
  const root=document.getElementById('sheet-root'),g=cur(),p=ui.pending;
  if(ui.gkSheet&&g&&ui.view==='live'){
    const t=ui.gkSheet, l=gkList(g,t), c=gkCur(g,t), team=t==='H'?g.home:g.away;
    root.innerHTML=`<div class="scrim" data-act="gkclose"></div>
    <div class="sheet" role="dialog" aria-label="Torhüter wechseln"><div class="sheet-in">
      <div><h3><i class="dot ${t==='H'?'h':'a'}"></i> Torhüter ${esc(team)}</h3><div class="sub">Ab jetzt zählen alle Schüsse auf dieses Tor für den gewählten Goalie (${PER[g.period]}).</div></div>
      ${l.length?`<div class="gklist">${l.map((n,i)=>`<button data-act="gkset" data-t="${t}" data-i="${i}" aria-pressed="${c===n}">${esc(n)}</button>`).join('')}<button class="en" data-act="gkset" data-t="${t}" data-i="en" aria-pressed="${c===''}">Leeres Tor</button></div>`:'<p class="note" style="margin:0">Noch kein Torhüter eingetragen.</p>'}
      <div class="lbl">Torhüter hinzufügen</div>
      <div class="gkadd"><input id="gk-new" placeholder="Name" autocomplete="off" maxlength="30"><button class="btn primary" data-act="gkadd" data-t="${t}">Hinzufügen</button></div>
      <button class="btn" data-act="gkclose">Schließen</button>
    </div></div>`;
    return;
  }
  if(!p||!g||ui.view!=='live'||p.gid!==g.id){root.innerHTML='';return}
  const s=p.s;
  if(p.step==='net'){
    const c=teamC(p.t), fk=facing(g,p.t);
    root.innerHTML=`<div class="scrim" data-act="cancel"></div>
    <div class="sheet" role="dialog" aria-label="Wohin ging der Schuss"><div class="sheet-in">
      <div><h3>${p.r==='G'?'Tor':'Gehalten'} – wohin ging der Schuss?</h3><div class="sub">Tipp auf die Stelle im Tor · Sicht des Schützen von vorne${fk!==undefined?' · Goalie: '+esc(gkName(fk)):''}</div></div>
      ${netSVG('net-pick','',true,true)}
      <div class="btns"><button class="btn" data-act="netback">← Zurück</button><button class="btn" data-act="netskip">Ohne Torbild speichern</button></div>
    </div></div>`;
    const svg=document.getElementById('net-pick');
    svg.addEventListener('click',e=>{
      const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());
      if(q.x<NX0-14||q.x>NX0+NW+14||q.y<NY0-14||q.y>NY0+NH+10)return;
      const cl=v=>Math.max(.02,Math.min(.98,v));
      saveShot(g,p.r,{nx:+cl((q.x-NX0)/NW).toFixed(3),ny:+cl((q.y-NY0)/NH).toFixed(3)});render();
    });
    return;
  }
  const tb=(t,n)=>`<button data-act="pteam" data-t="${t}" aria-pressed="${p.t===t}"><i class="dot ${t==='H'?'h':'a'}"></i>${esc(n)}</button>`;
  const c=teamC(p.t), ring=s==='EV'?'transparent':SITC[s];
  root.innerHTML=`<div class="scrim" data-act="cancel"></div>
  <div class="sheet" role="dialog" aria-label="Schuss erfassen"><div class="sheet-in">
    <div><h3>Schuss erfassen</h3><div class="sub">${PER[g.period]} · ${SIT[s]} · ${(Math.hypot(p.x-(p.t==='H'?560:40),p.y-150)/10).toFixed(0)} m vom Tor${facing(g,p.t)!==undefined?' · auf '+esc(gkName(facing(g,p.t))):''}</div></div>
    <div class="lbl">Wer hat geschossen?</div>
    <div class="teamsel">${tb('H',g.home)}${tb('A',g.away)}</div>
    <div class="lbl">Situation für diesen Schuss</div>
    <div class="sitsel"><button data-act="psit" data-s="EV" aria-pressed="${s==='EV'}">5 gegen 5</button><button class="pp" data-act="psit" data-s="PP" aria-pressed="${s==='PP'}">Überzahl (PP)</button><button class="sh" data-act="psit" data-s="SH" aria-pressed="${s==='SH'}">Unterzahl (SH)</button></div>
    <div class="lbl">Ergebnis – bei Tor und Gehalten folgt das Torbild</div>
    <div class="results">
      <button class="goal" style="--gc:${c};box-shadow:inset 0 0 0 4px ${ring}" data-act="save" data-r="G">${icon('G','var(--on-mark)',s==='EV'?null:ring)}Tor${s!=='EV'?' ('+s+')':''}</button>
      <button data-act="save" data-r="S">${icon('S',c)}Gehalten</button>
      <button data-act="save" data-r="M">${icon('M',c)}Vorbei</button>
      <button data-act="save" data-r="B">${icon('B',c)}Geblockt</button>
    </div>
    <button class="btn" data-act="cancel">Abbrechen</button>
  </div></div>`;
}

function saveShot(g,r,extra){
  const p=ui.pending;if(!g||!p)return;
  const shot=Object.assign({id:uid(),t:p.t,x:p.x,y:p.y,p:g.period,r,s:p.s,ts:Date.now()},extra||{});
  const fk=facing(g,p.t);if(fk!==undefined)shot.gk=fk;g.shots.push(shot);
  if(r==='G'&&p.s==='PP'&&g.situation!=='EV')g.situation='EV';
  ui.pending=null;commit(g);
}
/* ---------- Aktionen ---------- */
document.addEventListener('click',async e=>{
  if(!started)return;
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT')return;
  const a=el.dataset.act,g=cur();
  if(a!=='delgame'&&a!=='delex')ui.armed=null;
  switch(a){
    case'view':ui.toTop=ui.view!==el.dataset.v;ui.view=el.dataset.v;ui.pending=null;ui.big=null;ui.gkSheet=null;ui.setMsg=null;ui.restoreMsg=null;if(ui.view==='stats'&&cur())ui.statsId=cur().id;if(ui.view==='settings'&&isAdmin())loadMembers();break;
    case'period':if(!g)break;g.period=+el.dataset.p;g.situation='EV';commit(g);break;
    case'sit':if(!g)break;g.situation=el.dataset.s;commit(g);break;
    case'pteam':ui.pending.t=el.dataset.t;ui.pending.s=situationFor(g,el.dataset.t);break;
    case'psit':ui.pending.s=el.dataset.s;break;
    case'fres':ui.fRes=el.dataset.v;break;
    case'cancel':ui.pending=null;break;
    case'gkopen':ui.pending=null;ui.gkSheet=el.dataset.t;break;
    case'gkclose':ui.gkSheet=null;break;
    case'gkset':case'gkadd':{if(!g)break;const t=el.dataset.t;g.goalies=g.goalies||{H:[],A:[]};g.goalies[t]=g.goalies[t]||[];g.gk=g.gk||{};g.gkLog=g.gkLog||[];
      let n;if(a==='gkadd'){n=(document.getElementById('gk-new').value||'').trim();if(!n)return;if(!g.goalies[t].includes(n))g.goalies[t].push(n)}
      else n=el.dataset.i==='en'?'':g.goalies[t][+el.dataset.i];
      if(n===undefined)break;
      if(gkCur(g,t)!==n||g.gk[t]===undefined){g.gk[t]=n;g.gkLog.push({t,n,p:g.period,ts:Date.now()})}
      ui.gkSheet=null;commit(g);break;}
    case'nett':ui.netT=el.dataset.v;break;
    case'netres':ui.netRes=el.dataset.v;break;
    case'fgk':ui.fGk=el.dataset.v==='all'?'all':(ui.gkKeys||[])[+el.dataset.v]||'all';break;
    case'save':{const p=ui.pending;if(!g||!p)break;const r=el.dataset.r;
      if(r==='G'||r==='S'){p.step='net';p.r=r;break}
      saveShot(g,r);break;}
    case'netback':if(ui.pending)ui.pending.step=null;break;
    case'netskip':if(g&&ui.pending)saveShot(g,ui.pending.r);break;
    case'undo':{if(!g||!g.shots.length)break;const last=g.shots.reduce((m,s)=>s.ts>m.ts?s:m);g.shots=g.shots.filter(s=>s!==last);commit(g);break;}
    case'delshot':if(!g)break;g.shots=g.shots.filter(s=>s.id!==el.dataset.id);commit(g);break;
    case'finish':if(!g)break;g.status='final';ui.statsId=g.id;ui.view='stats';ui.fPer='all';commit(g);break;
    case'fper':ui.fPer=el.dataset.v;break;
    case'igfmt':ui.igFmt=el.dataset.v;break;
    case'igsave':savePost(el);return;
    case'scope':ui.liveScope=el.dataset.v;break;
    case'big':ui.big=ui.view;break;
    case'bigclose':ui.big=null;break;
    case'slot':ui.showSlot=!ui.showSlot;ls.set('shotmap_slot',ui.showSlot);break;
    case'fcol':ui.fColor=el.dataset.v;break;
    case'openstats':ui.statsId=el.dataset.id;ui.fPer='all';ui.fGk='all';ui.view='stats';ui.toTop=true;break;
    case'resume':{const x=byId(el.dataset.id);if(!x)break;const c=cur();const ch=[x];if(c&&c!==x){c.status='final';ch.push(c)}x.status='live';S.currentId=x.id;ui.view='live';commit(...ch);break;}
    case'delgame':if(ui.armed===el.dataset.id){removeGame(el.dataset.id);ui.armed=null}else ui.armed=el.dataset.id;break;
    case'delex':if(ui.armed==='ex'){S.games.filter(x=>x.example).map(x=>x.id).forEach(removeGame);ui.armed=null}else ui.armed='ex';break;
    case'dir':ui.newDir=el.dataset.v;el.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===el));return;
    case'logout':await logout();return;
    case'mreload':await loadMembers();break;
    case'mset':{const k=el.dataset.k,patch=k==='approve'?{approved:true}:k==='block'?{approved:false,role:'member'}:k==='admin'?{role:'admin'}:{role:'member'};el.disabled=true;await setMember(el.dataset.id,patch);return;}
    case'copy':{const t=document.getElementById('bk-out');const ok=()=>{el.textContent='Kopiert ✓';setTimeout(()=>{el.textContent='Code kopieren'},1800)};
      try{await navigator.clipboard.writeText(t.value);ok()}catch(err){t.focus();t.select();try{document.execCommand('copy');ok()}catch(e2){el.textContent='Text markiert – jetzt kopieren'}}return;}
    case'restore':{const raw=document.getElementById('bk-in').value.trim();
      try{const d=JSON.parse(raw);const list=Array.isArray(d)?d:d&&d.games;if(!Array.isArray(list)||!list.every(x=>x&&x.id&&Array.isArray(x.shots)))throw new Error('x');
        list.forEach(x=>{const i=S.games.findIndex(y=>y.id===x.id);if(i<0)S.games.push(x);else S.games[i]=x});commit(...list);
        ui.restoreMsg={t:'ok',m:`${list.length} ${list.length===1?'Spiel':'Spiele'} eingespielt.`};
      }catch(err){ui.restoreMsg={t:'err',m:'Das ist kein gültiger Sicherungscode. Kopier ihn bitte vollständig aus „Daten sichern“.'}}
      break;}
    default:return;
  }
  render();
});
document.addEventListener('change',e=>{if(e.target.id==='stats-game'){ui.statsId=e.target.value;ui.fPer='all';ui.fGk='all';render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='gk-new'){e.preventDefault();const b=document.querySelector('[data-act=gkadd]');if(b)b.click();return}if(e.key==='Escape'){if(ui.gkSheet)ui.gkSheet=null;else if(ui.pending)ui.pending=null;else if(ui.big)ui.big=null;else return;render()}});
let rzT=null;window.addEventListener('resize',()=>{fitPost();if(!ui.big)return;clearTimeout(rzT);rzT=setTimeout(render,150)});

let lock=null;function wake(){try{if(!lock&&navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>{lock=l;l.addEventListener('release',()=>lock=null)}).catch(()=>{})}catch(e){}}

/* Zoom am Handy verhindern: Pinch (iOS-Gesten, Zwei-Finger) und Doppeltipp */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
let lastTouch=0;document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouch<350&&!(e.target.closest&&e.target.closest('input,textarea,select'))){e.preventDefault();const el=e.target.closest&&e.target.closest('button,[data-act],svg');if(el&&el.tagName!=='svg'&&el.tagName!=='SVG')el.click();else if(el)el.dispatchEvent(new MouseEvent('click',{bubbles:true,clientX:e.changedTouches[0].clientX,clientY:e.changedTouches[0].clientY}))}lastTouch=now},{passive:false});
/* ---------- Start ---------- */
initStore();
if(!CLOUD){start()}
else{
  sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'&&started){started=false;showGate('login')}});
  showGate('loading');
  sb.auth.getSession().then(({data})=>{const s=data&&data.session;if(!s)showGate('login');else afterLogin(s.user)}).catch(()=>showGate('login','Keine Verbindung.'));
}
})();
